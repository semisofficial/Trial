services:
  # Customer/admin React application served from Render's global CDN.
  - type: web
    runtime: static
    name: semiskitchen
    rootDir: semis-kitchen
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Stable existing WhatsApp URL, now backed by the admin's saved QR.
      - type: rewrite
        source: /upi-qr.jpeg
        destination: https://semiskitchenbe.onrender.com/api/payment-qr/image
      # Keep API calls first-party so the HttpOnly Admin session cookie works.
      - type: rewrite
        source: /api/*
        destination: https://semiskitchenbe.onrender.com/api/*
      - type: rewrite
        source: /invoice/*
        destination: https://api.semiskitchen.in/api/invoices/share/*
      # Retired short links return to the regular menu without loading an old checkout.
      - type: redirect
        source: /o/*
        destination: /
      # React Router SPA fallback; keep this after the API rewrites.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /upi-qr.jpeg
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /upi-qr.jpeg
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      # First-party built scripts/fonts; Leaflet needs inline styles and these OSM services.
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /nashi
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /invoice/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /invoice/*
        name: Cache-Control
        value: private, no-store
      - path: /invoice/*
        name: Referrer-Policy
        value: no-referrer
      - path: /api/invoices/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /api/invoices/*
        name: Cache-Control
        value: private, no-store
      - path: /api/invoices/*
        name: Referrer-Policy
        value: no-referrer

  # Always-on Express API in the same region as the Neon project.
  - type: web
    runtime: node
    name: semiskitchenbe
    rootDir: node-server
    region: singapore
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://semiskitchen.in,https://www.semiskitchen.in,https://semiskitchen.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://semiskitchen.in
      - key: PUBLIC_API_BASE_URL
        value: https://semiskitchen.in
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: WHATSAPP_NOTIFICATIONS_ENABLED
        value: "false"
